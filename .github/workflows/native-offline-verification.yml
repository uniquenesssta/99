name: Native offline verification
on:
  pull_request:
  push:
    branches: ['verify/o02-o04-o05-native']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml
      - run: cargo +stable build --locked --release --manifest-path native-src/hfm-core-worker/Cargo.toml
