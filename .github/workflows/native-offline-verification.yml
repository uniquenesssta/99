name: Windows C-08.1 validation
on:
  push:
    branches: ['stage/09-preview-tags-app', 'stage/10-preview-performance', 'stage/11-list-grid-view']
permissions:
  contents: read
jobs:
  windows-c08-network-list:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run test:font-view-layout-dom
      - run: npm run diagnostics:shared-io-integration
      - run: npm run diagnostics:shared-filesystem
      - run: npm run rust:build
      - name: Build compatible preview helper
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 && native-src\preview-renderer\build-win.cmd"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node build/diagnostics/check-list-preview-native.cjs
      - run: npm run test:font-view-layout-dom
        env:
          HFM_LIST_NATIVE_SAMPLES: artifacts/list-preview/dom-samples.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: list-preview-native
          path: artifacts/list-preview
          retention-days: 7
      - run: npm run diagnostics:mapped-drive-unicode
      - run: cargo fetch --locked --manifest-path native-src/hfm-core-worker/Cargo.toml
      - run: npm run diagnostics:execution-lifecycle
      - run: npm run diagnostics:incremental-metadata-refresh
      - run: npm run diagnostics:font-physical-path-authorization
      - run: npm run diagnostics:decomposition-baseline
      - run: npm run diagnostics:deactivation-refresh
      - run: npm run diagnostics:active-view-consistency
      - run: npm run diagnostics:network-list-font-files-batching
      - run: npm run diagnostics:scan-fallback
      - run: npm run diagnostics:shared-io-process
      - run: npm run diagnostics:rust-worker-clients
      - run: npm run diagnostics:rust-worker-transport
      - run: npm run typecheck
      - run: npm run diagnostics:index-io-activation-shutdown-current
      - run: npm run verify
      - run: node node_modules/electron-vite/bin/electron-vite.js build
      - run: node build/obfuscate-dist.cjs
      - run: git diff --check 8bc364b9bc1f9660959ca168275402a0d1de8584 HEAD
  directory-metadata-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml preview_render::types::tests
      - run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml shared_file_io::tests
      - run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml preview_cache::readonly_tests
      - run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml core_daemon::lanes::tests
      - run: cargo build --locked --release --manifest-path native-src/hfm-core-worker/Cargo.toml
      - name: Exercise native directory receipts through scan listing
        shell: bash
        run: |
          worker='native-src/hfm-core-worker/target/release/hfm-core-worker'
          if [ "$RUNNER_OS" = 'Windows' ]; then worker="$worker.exe"; fi
          HFM_TEST_NATIVE_WORKER="$worker" npm run diagnostics:network-directory-metadata
      - run: npm run diagnostics:network-list-font-files-batching
      - run: npm run diagnostics:scan-lifecycle-durability
      - run: npm run diagnostics:shared-io-integration
      - run: npm run diagnostics:watcher-index-consistency
      - run: npm run typecheck
      - run: node node_modules/electron-vite/bin/electron-vite.js build
      - run: node build/obfuscate-dist.cjs
