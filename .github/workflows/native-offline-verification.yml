name: Windows C-08.1 validation
on:
  push:
    branches: ['stage/09-preview-tags-app']
permissions:
  contents: read
jobs:
  windows-c08-network-list:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run diagnostics:decomposition-baseline
      - run: npm run diagnostics:deactivation-refresh
      - run: npm run diagnostics:active-view-consistency
      - run: npm run diagnostics:network-list-font-files-batching
      - run: npm run diagnostics:scan-fallback
      - run: npm run diagnostics:shared-io-process
      - run: npm run diagnostics:shared-io-integration
      - run: npm run diagnostics:rust-worker-clients
      - run: npm run diagnostics:rust-worker-transport
      - run: npm run typecheck
      - run: node --experimental-sqlite build/diagnostics/check-index-io-activation-shutdown-baseline.cjs --current
      - run: npm run verify
      - run: node node_modules/electron-vite/bin/electron-vite.js build
      - run: node build/obfuscate-dist.cjs
      - run: git diff --check 8bc364b9bc1f9660959ca168275402a0d1de8584 HEAD
