name: Windows font identity audit
on:
  push:
    branches: ['stage/12-font-identity-permissions', 'stage/12-font-recovery-f14']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Build real Windows Rust worker
        id: worker
        run: node build/rust/build-core-worker.cjs --required
      - name: Verify shell containment, refresh page authority and optional work
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 4
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          & node build/diagnostics/check-font-view-membership.cjs *>> artifacts/ui-refresh-regression.log
          $membershipExit = $LASTEXITCODE
          & node build/diagnostics/check-preview-closing-stats.cjs *>> artifacts/ui-refresh-regression.log
          $statsExit = $LASTEXITCODE
          & node build/diagnostics/check-font-view-layout.cjs --dom-shell-only *>> artifacts/ui-refresh-regression.log
          $shellExit = $LASTEXITCODE
          "membershipExit=$membershipExit statsExit=$statsExit shellExit=$shellExit" | Add-Content artifacts/ui-refresh-regression.log
          Get-Content -LiteralPath artifacts/ui-refresh-regression.log -Encoding utf8
          if ($membershipExit -ne 0 -or $statsExit -ne 0 -or $shellExit -ne 0) { exit 1 }
      - name: Retain shell geometry and refresh regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-recovery-ui-refresh-regression
          path: |
            artifacts/ui-refresh-regression.log
            artifacts/font-identity-f04/*app-shell*.json
            artifacts/font-identity-f04/*app-shell*.png
          retention-days: 14
      - name: Verify native owned preview directory boundary
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          cmd /d /c "cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml owned_preview_stage > artifacts\native-owned-stage.log 2>&1"
          $nativeExit = $LASTEXITCODE
          Get-Content -LiteralPath artifacts/native-owned-stage.log -Encoding utf8
          exit $nativeExit
      - name: Retain native stage log before remaining full gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-recovery-native-stage-log
          path: artifacts/native-owned-stage.log
          retention-days: 14
      - name: Verify targeted retest regression composition
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = 0
          foreach ($script in @('check-local-user-state.cjs', 'check-orchestration-contracts.cjs', 'check-query-read-cancellation.cjs', 'check-preview-directory-absence.cjs', 'check-watcher-noop-freshness.cjs', 'check-root-probe-lifecycle.cjs', 'check-shared-filesystem.cjs')) {
            & node "build/diagnostics/$script" *>> artifacts/targeted-retest.log
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Get-Content -LiteralPath artifacts/targeted-retest.log -Encoding utf8
          if ($failed -gt 0) { exit 1 }
      - name: Retain targeted regression log before complete gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-recovery-targeted-retest-log
          path: artifacts/targeted-retest.log
          retention-days: 14
      - name: Verify tag foreground ownership and observation transparency
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = 0
          foreach ($script in @('check-tag-font-recovery.cjs', 'check-preview-reuse-observation.cjs', 'check-baseline-contention-contract.cjs')) {
            & node "build/diagnostics/$script" *>> artifacts/tag-preview-optimization.log
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Get-Content -LiteralPath artifacts/tag-preview-optimization.log -Encoding utf8
          if ($failed -gt 0) { exit 1 }
      - name: Retain tag and preview optimization regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-recovery-tag-preview-optimization-log
          path: artifacts/tag-preview-optimization.log
          retention-days: 14
      - name: Verify selective NAS reconciliation, snapshot retry and visible status
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = 0
          foreach ($script in @('check-font-parse-stability-capability.cjs', 'check-shared-tag-count-retry.cjs', 'check-shared-watcher-reconciliation.cjs', 'check-font-view-membership.cjs', 'check-shared-watch-status.cjs')) {
            & node --experimental-sqlite "build/diagnostics/$script" *>> artifacts/nas-reconciliation.log
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Get-Content -LiteralPath artifacts/nas-reconciliation.log -Encoding utf8
          if ($failed -gt 0) { exit 1 }
      - name: Retain NAS reconciliation regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-nas-reconciliation
          path: artifacts/nas-reconciliation.log
          retention-days: 14
      - name: Verify query cancellation transport and committed metadata locators
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = 0
          foreach ($script in @('check-query-work-lifetime.cjs', 'check-font-query-ipc.cjs', 'check-foreground-ipc-latency.cjs', 'check-incremental-metadata-refresh.cjs', 'check-shared-metadata-rust-atomicity.cjs', 'check-shared-tag-native-delete.cjs')) {
            & node "build/diagnostics/$script" *>> artifacts/query-metadata-repair.log
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Get-Content -LiteralPath artifacts/query-metadata-repair.log -Encoding utf8
          if ($failed -gt 0) { exit 1 }
      - name: Retain cancellation and metadata repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-query-metadata-repair
          path: |
            artifacts/query-metadata-repair.log
            artifacts/font-query-ipc/**/report.json
            artifacts/real-feedback/foreground-ipc-*/report.json
          retention-days: 14
      - name: Verify offline-root isolation and one-budget preview fallback
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $focusedExit = 0
          foreach ($script in @('check-shared-availability-probe-ownership.cjs', 'check-optional-maintenance-admission.cjs', 'check-preview-fallback-lifetime.cjs', 'check-main-composition-runtime.cjs', 'check-rust-scheduler-cache-generation.cjs', 'check-shared-io-integration.cjs')) {
            & node --experimental-sqlite "build/diagnostics/$script" *>> artifacts/offline-root-isolation.log
            if ($LASTEXITCODE -ne 0) { $focusedExit = 1 }
          }
          & node --experimental-sqlite build/diagnostics/check-merged-index-mutation-serialization.cjs --native-worker build/native/hfm-core-worker.exe *>> artifacts/offline-root-isolation.log
          if ($LASTEXITCODE -ne 0) { $focusedExit = 1 }
          Get-Content -LiteralPath artifacts/offline-root-isolation.log -Encoding utf8
          exit $focusedExit
      - name: Retain offline-root isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-root-isolation
          path: artifacts/offline-root-isolation.log
          retention-days: 14
      - name: Verify manual inventory, exact page authority and optional publication
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = 0
          foreach ($script in @('check-manual-refresh-inventory.cjs', 'check-install-status-authority.cjs', 'check-preview-cache-publish.cjs', 'check-preview-storage-routing.cjs')) {
            & node --experimental-sqlite "build/diagnostics/$script" *>> artifacts/manual-page-preview.log
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Get-Content -LiteralPath artifacts/manual-page-preview.log -Encoding utf8
          if ($failed -gt 0) { exit 1 }
      - name: Retain manual inventory and page authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-manual-page-preview
          path: artifacts/manual-page-preview.log
          retention-days: 14
      - name: Verify scan, restore, cleanup and projection failure recovery
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = 0
          foreach ($script in @('check-scan-partial-retention.cjs', 'check-install-projection-recovery.cjs', 'check-sqlite-manual-restore.cjs', 'check-cache-cleanup-safety.cjs')) {
            & node --experimental-sqlite "build/diagnostics/$script" *>> artifacts/failure-recovery.log
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          Get-Content -LiteralPath artifacts/failure-recovery.log -Encoding utf8
          if ($failed -gt 0) { exit 1 }
      - name: Retain failure recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-recovery
          path: artifacts/failure-recovery.log
          retention-days: 14
      - name: Verify complete existing Windows diagnostics
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          cmd /d /c "npm run verify > artifacts\verification.log 2>&1"
          $verifyExit = $LASTEXITCODE
          Get-Content -LiteralPath artifacts/verification.log -Encoding utf8
          exit $verifyExit
      - name: Retain verification log before remaining full gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-recovery-verification-log
          path: artifacts/verification.log
          retention-days: 14
      - name: Verify production directory batches against native worker
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        env:
          HFM_TEST_NATIVE_WORKER: build/native/hfm-core-worker.exe
        run: node build/diagnostics/check-network-directory-metadata.cjs
      - name: Verify actual legacy storage and merged projection composition
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-production-projection.cjs --report artifacts/real-feedback/projection.json
      - name: Complete real-file refresh with interleaved foreground work
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/run-real-feedback-work.cjs
      - name: Same-state recovery, status, private preview and uninstall reopen
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-preview-chain-performance.cjs --recovery-chain
      - name: Verify populated legacy database migrations in native owners
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml legacy_schema
      - name: Verify production identity compatibility and operation targets
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-font-identity-compatibility.cjs
      - name: Verify activation transaction regressions
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-font-activation-transaction.cjs
      - name: Verify exact uninstall planning
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-local-user-state.cjs --case=uninstall
      - name: Verify Node local tag persistence
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-local-tag-node-persistence.cjs
      - name: Verify Rust local tag reads and writes
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml local_tags
      - name: Verify exact install-status authority and unavailable reads
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml install_authority
      - name: Verify bounded stdout listing without output writes
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml stdout_listing_tests
      - name: Verify read-only shared binding snapshot boundary
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml binding_snapshot_tests
      - name: Verify memory-only WAL binding snapshot replay
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml shared_metadata::binding_snapshot::tests
      - name: Verify directory-only native content revision
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml directory_bookkeeping_tests
      - name: Verify Rust identity contract vectors
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml merged_index::path_utils::tests
      - name: Verify prepared root projection transaction guards
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml merged_index::sync::prepared_sync_tests
      - name: Native strict full-rebuild overlay preservation
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml merged_strict_rebuild
      - name: Verify Unicode registry decoding
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: 'cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml font_registry::'
      - name: Verify bounded retries (real mutations are local-only)
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: 'cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml font_mutation::'
      - name: Verify shared file identity evidence
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: 'cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml shared_file_io::'
      - name: Verify selective native parse admission and identity guards
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: 'cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml scanner::parse_batch::tests'
      - name: Verify complete native listing and unreadable source retention
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: 'cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml scanner::list_files::scan_completeness_tests'
      - name: Verify isolated native parent lifetime
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: 'cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml isolated_lifetime::tests'
      - name: Verify watcher diff evidence
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: 'cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml watcher::'
      - name: Accept production IDs, pagination and actual Electron DOM
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-font-identity-reproduction.cjs
      - name: Verify complete list and grid Electron DOM scenarios
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: npm run test:font-view-layout-dom
      - name: Verify floating scrollbar overlays with native Electron input
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-font-view-layout.cjs --dom-feedback
      - name: Compare real F13 operation and PNG decode workload
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node build/diagnostics/check-preview-chain-performance.cjs --work-comparison
      - name: Build application bundles
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        run: node node_modules/electron-vite/bin/electron-vite.js build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-identity-f07-evidence
          path: |
            artifacts/font-identity-f01
            artifacts/font-identity-f04
            artifacts/list-preview
            artifacts/real-feedback
            artifacts/font-query-ipc/**/report.json
            !artifacts/**/*.ttf
            !artifacts/**/*.otf
            !artifacts/**/*.ttc
            !artifacts/**/*.otc
            !artifacts/**/*.woff
            !artifacts/**/*.woff2
          retention-days: 14

  baseline-observation:
    name: Frozen baseline contention investigation (not acceptance)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Build fixture preparation worker
        run: node build/rust/build-core-worker.cjs --required
      - name: Observe each frozen baseline condition once
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          cmd /d /c "node build/diagnostics/run-baseline-contention.cjs > artifacts\baseline-contention.log 2>&1"
          $diagnosticExit = $LASTEXITCODE
          Get-Content -LiteralPath artifacts/baseline-contention.log -Encoding utf8
          exit $diagnosticExit
      - name: Retain separate baseline diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-baseline-contention-investigation
          path: |
            artifacts/baseline-contention.log
            artifacts/real-feedback/baseline-contention
            artifacts/real-feedback/baseline-contention-orchestration.json
            !artifacts/**/*.ttf
            !artifacts/**/*.otf
            !artifacts/**/*.ttc
            !artifacts/**/*.otc
            !artifacts/**/*.woff
            !artifacts/**/*.woff2
          retention-days: 14
