name: Windows font identity audit
on:
  push:
    branches: ['stage/12-font-identity-permissions']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify renderer query and user intent regressions
        run: node build/diagnostics/check-user-intent-consistency.cjs
      - name: Verify Rust identity contract vectors
        run: cargo test --locked --manifest-path native-src/hfm-core-worker/Cargo.toml merged_index::path_utils::tests
      - name: Build real Windows Rust worker
        run: cargo build --locked --release --manifest-path native-src/hfm-core-worker/Cargo.toml
      - name: Reproduce baseline defects and unique-ID control (not repair acceptance)
        run: node build/diagnostics/check-font-identity-reproduction.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-identity-f01-evidence
          path: artifacts/font-identity-f01
          retention-days: 14
