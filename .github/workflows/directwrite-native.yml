name: DirectWrite native proof
on:
  push:
    branches: ['stage/dw-resident-directwrite-preview']
permissions:
  contents: read
jobs:
  directwrite-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
      - run: npm run rust:build
      - run: npm run diagnostics:mapped-drive-unicode
      - name: Compile against Windows SDK
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          call native-src\preview-renderer\directwrite\build-win.cmd
      - name: Real private TTF CFF TTC and PNG checks
        run: python build/diagnostics/check-directwrite-native.py
      - name: Production owner and hostile subprocess checks
        run: npm run diagnostics:directwrite-service
      - name: Resident DirectWrite, EOF, parent death and owner integration
        run: npm run test:directwrite-resident
      - name: Isolated font staging, local store and resident integration
        run: npm run diagnostics:directwrite-font-store && npm run test:directwrite-staging
      - name: Foreground trial cache and native production owner
        run: npm run diagnostics:directwrite-preview && node build/diagnostics/check-directwrite-preview-native.cjs
      - name: Real font object reuse, eviction and memory limits
        run: python build/diagnostics/check-directwrite-cache.py
      - name: Reject source mutations and restore executable
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          python build/diagnostics/check-directwrite-mutants.py
      - uses: actions/upload-artifact@v4
        with:
          name: directwrite-native-proof
          path: build/native/directwrite/hfm-directwrite-preview.exe
